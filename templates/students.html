{% extends "base.html" %}{% block title %}Students{% endblock %}{% block content %}<h1>Students</h1><section class="card"><table><tr><th>Register No</th><th>Name</th><th>Year</th><th>Section</th></tr>{% for s in students %}<tr><td>{{s.register_number}}</td><td>{{s.full_name}}</td><td>{{s.get_year_display}}</td><td>{{s.section}}</td></tr>{% empty %}<tr><td colspan="4">No students yet. Add from Admin.</td></tr>{% endfor %}</table></section>{% endblock %}
