{% extends "base.html" %}

{% block title %}Login | College Attendance{% endblock %}

{% block content %}

<style>
    .login-page {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .login-card {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        text-align: center;
    }

    .login-icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 15px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
    }

    .login-card h2 {
        margin: 5px 0 8px;
        color: #1e293b;
        font-size: 28px;
    }

    .login-subtitle {
        color: #64748b;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .login-card form p {
        text-align: left;
        margin-bottom: 18px;
    }

    .login-card label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #334155;
    }

    .login-card input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    .login-card input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
    }

    .login-footer {
        margin-top: 20px;
        font-size: 13px;
        color: #94a3b8;
    }
</style>

<div class="login-page">

```
<section class="login-card">

    <div class="login-icon">
        🎓
    </div>

    <h2>Welcome Back</h2>

    <p class="login-subtitle">
        College Attendance Management System
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="login-btn">
            🔐 Login
        </button>
    </form>

    <div class="login-footer">
        Secure attendance management portal
    </div>

</section>
```

</div>

{% endblock %}
