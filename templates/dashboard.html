{% extends "base.html" %}{% block title %}Dashboard{% endblock %}{% block content %}<h1>Attendance Dashboard</h1><div class="grid">{% for label,value in rows %}<div class="stat"><small>{{label}}</small><strong>{{value}}</strong></div>{% endfor %}</div><section class="card"><h2>Students by Year</h2><table><tr><th>Year</th><th>Students</th></tr>{% for y,n in year_counts %}<tr><td>{{y}}</td><td>{{n}}</td></tr>{% endfor %}</table></section>{% endblock %}
